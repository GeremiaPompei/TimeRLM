[project]
name = "anomalyxl-tslm-baselines"
version = "0.1.0"
description = "Standalone SFT for the paper's TSLM baselines (ChatTS, OpenTSLM-Flamingo, ITFormer) on AnomalyXL precise/coarse"
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "MIT"

dependencies = [
  "torch>=2.0",
  "numpy>=1.21",
  "tqdm>=4.62",
  "transformers>=5.1.0.dev0",
  "huggingface-hub>=0.16",
  "datasets>=2.0",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
  # peft/chronos-forecasting pinned exactly (matching the versions these
  # baselines were originally trained against, not just loose bounds):
  # chronos-forecasting>2.2.2 renamed the internal RoPE class that
  # chronos2_encoder.py's meta-device-buffer repair patch reaches into,
  # breaking the patch on newer releases.
  "peft==0.18.1",
  "einops>=0.6",
  "chronos-forecasting==2.2.2",
  "open-flamingo>=0.0.2",
  "wandb>=0.15",
]

[tool.uv]
# Linux/CUDA only (matches how these baselines were trained); restricts uv's
# universal resolver so it doesn't try to satisfy chronos-forecasting==2.2.2's
# transformers<5 constraint on a hypothetical win32 target we'll never use.
environments = ["sys_platform == 'linux'"]
# chronos-forecasting==2.2.2 declares transformers>=4.41,<5; this overrides
# that transitive bound so the git-sourced transformers 5.x build (needed
# for Qwen3.5) still gets installed.
override-dependencies = [
    "transformers>=5.1.0.dev0",
]

[tool.uv.sources]
# Qwen3.5 support requires a transformers build newer than any PyPI release
# at the time these baselines were trained.
transformers = { git = "https://github.com/huggingface/transformers.git", rev = "5c1c72b" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
