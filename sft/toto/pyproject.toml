[project]
name = "toto-anomalyxl-sft"
version = "0.1.0"
description = "Standalone SFT + eval for the paper's Toto baseline (Toto-1.0-QA-Experimental) on AnomalyXL precise/coarse"
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "MIT"

dependencies = [
  "torch==2.8.0",
  "transformers==4.57.1",
  "peft==0.18.1",
  "toto-ts==0.2.0",
  "qwen-vl-utils==0.0.14",
  "torchvision==0.23.0",
  "accelerate==1.14.0",
  "huggingface-hub==0.36.2",
  "safetensors==0.8.0",
  "pandas>=2.0",
  "numpy>=1.21",
  "pillow>=10.0",
  "scikit-learn>=1.0",
  "tqdm>=4.62",
  "setuptools<81",  # toto-ts -> gluonts -> lightning.fabric needs pkg_resources
]

[tool.uv]
override-dependencies = [
    "torch==2.8.0",
    "transformers==4.57.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
