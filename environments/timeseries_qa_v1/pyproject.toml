[project]
name = "timeseries-qa-v1"
description = "AnomalyXL RLM environment for verifiers v1 (taskset + host-local rlm harness)"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.15.dev396",
    "timeseries-qa",
    "anomalyxl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["timeseries_qa_v1"]

# verifiers + timeseries-qa resolve from the prime-rl workspace sources.
[tool.uv.sources]
verifiers = { path = "../../prime-rl/deps/verifiers", editable = true }
timeseries-qa = { path = "../timeseries_qa", editable = true }
anomalyxl = { path = "../../anomalyXL", editable = true }

[tool.uv.extra-build-variables]
verifiers = { SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VERIFIERS = "0.1.15.dev396" }
